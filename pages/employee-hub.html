<script>
/* ================= EMPLOYEE HUB SOFT GATE =================
   SET THIS to the real GHL slug of the login page. If it does not
   match a published page the gate disables itself and this page
   still renders, instead of dead-ending on GHL's "Not found".
   ========================================================== */
(function(){
  var EH_LOGIN_URL='/employee-hub-login/';
  try{
    if(!/(^|\.)insynconline\.net$/.test(location.hostname)){return;} /* enforce only on the live site */
    var d=JSON.parse(localStorage.getItem('insHubAuth')||'null');
    if(d&&d.t&&(Date.now()-d.t)<=30*24*60*60*1000){return;}            /* already unlocked */

    var st=document.createElement('style');                             /* hold the body block back while we confirm */
    st.id='ehGateHide';st.textContent='.ins-page{visibility:hidden}';
    if(document.head){document.head.appendChild(st);}
    var done=false;
    function reveal(){
      if(done){return;}
      done=true;
      var n=document.getElementById('ehGateHide');
      if(n&&n.parentNode){n.parentNode.removeChild(n);}
    }
    setTimeout(reveal,1500);                                            /* watchdog: never leave the page blank */

    if(!window.fetch){location.replace(EH_LOGIN_URL);return;}
    fetch(EH_LOGIN_URL,{method:'HEAD'}).then(function(r){
      if(r&&r.ok){location.replace(EH_LOGIN_URL);}
      else{
        reveal();
        if(window.console){console.warn('[InSync Hub] No page at '+EH_LOGIN_URL+' — gate disabled. Publish the login page at that slug, or change EH_LOGIN_URL to match.');}
      }
    })['catch'](function(){reveal();});
  }catch(e){/* storage blocked: fail open to avoid a redirect loop */}
})();
</script>

<script>
(function(){
  'use strict';
  var page=document.getElementById('ehPage');
  if(!page){return;}

  /* ============================================================
     HERO BACKGROUND VIDEO — looping with a crossfade at every seam.
     Two stacked <video> elements share the same clip: the idle one
     starts and fades up while the playing one fades out, so the loop
     point is a soft dissolve instead of a visible jump.
     Change the clip by swapping the URL constant below.
     ============================================================ */
  var EH_HERO_VIDEO_URL='https://assets.cdn.filesafe.space/lAvsV54bgyIkgTbpk5QX/media/6abfcd4785f560d1665dba06.mp4';
  var EH_FADE=1.1;   /* crossfade length in seconds — also set in the CSS transition */

  var vidLayer=document.getElementById('ehVid'),
      shade=document.getElementById('ehVidShade'),
      hero=document.getElementById('ehHero');

  function motionOff(){
    return !EH_HERO_VIDEO_URL
      || window.innerWidth<=1024
      || (window.matchMedia&&(matchMedia('(pointer:coarse)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches));
  }

  if(vidLayer&&hero&&!motionOff()){
    /* A transformed/filtered ancestor breaks position:fixed — re-parent to body if one is found. */
    (function(){
      var n=vidLayer.parentElement,broken=false;
      while(n&&n!==document.body){
        var s=getComputedStyle(n);
        if((s.transform&&s.transform!=='none')||(s.filter&&s.filter!=='none')||(s.perspective&&s.perspective!=='none')||s.contain==='paint'||(s.getPropertyValue('will-change')||'').indexOf('transform')>-1){broken=true;break;}
        n=n.parentElement;
      }
      if(broken){document.body.appendChild(vidLayer);}
    })();

    var dead=false,armed=false,swapping=false;

    function mkVideo(){
      var v=document.createElement('video');
      v.muted=true;v.defaultMuted=true;v.playsInline=true;
      v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
      v.preload='auto';v.loop=false;
      v.addEventListener('error',kill);            /* decode guard */
      v.src=EH_HERO_VIDEO_URL;                     /* URL from a JS constant, never a src attribute */
      vidLayer.insertBefore(v,vidLayer.firstChild);
      return v;
    }
    function kill(){
      dead=true;
      vidLayer.classList.remove('is-on');
      vidLayer.style.display='none';
      page.classList.remove('vid-on');
    }

    var vA=mkVideo(),vB=mkVideo(),playing=vA,idle=vB;
    vA.classList.add('is-live');

    function arm(){                                 /* listeners are attached before src, so a cached load cannot outrun them */
      if(armed||dead||!isFinite(playing.duration)||!(playing.duration>0)){return;}
      armed=true;
      vidLayer.classList.add('is-on');
      page.classList.add('vid-on');
      try{var pr=playing.play();if(pr&&pr['catch']){pr['catch'](function(){});}}catch(e){}
      requestAnimationFrame(loopWatch);
      spanFrame();
    }
    vA.addEventListener('loadedmetadata',arm);
    vA.addEventListener('durationchange',arm);
    vA.addEventListener('canplay',arm);
    if(vA.readyState>=1){arm();}

    function loopWatch(){
      if(dead){return;}
      var d=playing.duration;
      if(!swapping&&isFinite(d)&&d>0&&playing.currentTime>=d-EH_FADE){
        swapping=true;
        var out=playing,inn=idle;
        try{inn.currentTime=0;var p2=inn.play();if(p2&&p2['catch']){p2['catch'](function(){});}}catch(e2){}
        inn.classList.add('is-live');               /* fades up */
        out.classList.remove('is-live');            /* fades out over the same beat */
        playing=inn;idle=out;
        setTimeout(function(){                       /* park the retired element once it is invisible */
          try{out.pause();out.currentTime=0;}catch(e3){}
          swapping=false;
        },EH_FADE*1000+80);
      }
      requestAnimationFrame(loopWatch);
    }

    /* Shade deepens across the hero's last 45vh (smoothstep, so the handoff reads
       as one continuous darkening), and the layer switches off once the hero has
       fully left the viewport so it costs nothing further down the page. */
    var sraf=0;
    function spanFrame(){
      sraf=0;
      if(dead){return;}
      var y=window.pageYOffset,vh=window.innerHeight;
      var r=hero.getBoundingClientRect(),bottom=r.bottom+y;
      var ramp=vh*0.45,start=bottom-ramp;
      var t=ramp>0?Math.max(0,Math.min((y-start)/ramp,1)):0;
      var e=t*t*(3-2*t);
      if(shade){shade.style.opacity=e.toFixed(3);}
      if(armed){vidLayer.classList.toggle('is-on',!(y>bottom+4));}
    }
    function onSpan(){if(!sraf){sraf=requestAnimationFrame(spanFrame);}}
    window.addEventListener('scroll',onSpan,{passive:true});
    window.addEventListener('resize',onSpan);
    spanFrame();
  }else if(vidLayer){
    vidLayer.style.display='none';
  }

  /* ---------- drifting brand squares (donor ember drift, re-branded) ---------- */
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ew=document.getElementById('ehEmbers');
  if(ew&&!reduced){
    for(var i=0;i<8;i++){
      var em=document.createElement('span');
      em.className='ins-sq-ember';
      em.style.setProperty('--x',(4+Math.random()*92)+'%');
      em.style.setProperty('--sz',(5+Math.random()*6).toFixed(1)+'px');
      em.style.setProperty('--t',(11+Math.random()*9).toFixed(1)+'s');
      em.style.setProperty('--dl',(-Math.random()*18).toFixed(1)+'s');
      em.style.setProperty('--swx',((Math.random()*120)-60).toFixed(0)+'px');
      em.style.setProperty('--rot',(90+Math.random()*220).toFixed(0)+'deg');
      em.style.setProperty('--op',(0.12+Math.random()*0.14).toFixed(2));
      em.style.setProperty('--sq-c',(i%2?'var(--navy-2)':'var(--orange)'));
      ew.appendChild(em);
    }
  }
})();
</script>

<script>
/* v2 reveal contract (donor): threshold:0 + bottom rootMargin (ratio thresholds
   starve on tall blocks), JS sibling stagger, above-fold release, on-screen-only
   safety net, and a scroll sweep for fast flicks. */
(function(){
  'use strict';
  var els = document.querySelectorAll('.ins-page .reveal');
  if (!('IntersectionObserver' in window)){ els.forEach(function(e){ e.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function(en){
    en.forEach(function(x){
      if (x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); }
    });
  }, { threshold:0, rootMargin:'0px 0px -12% 0px' });
  els.forEach(function(e){ io.observe(e); });

  // Stagger sibling reveals in JS so card grids cascade instead of popping as
  // a slab. Authored d1-d5 delays are left alone.
  var DELAYED = /(^|\s)d[1-5](\s|$)/;
  var seen = [];
  els.forEach(function(el){
    var p = el.parentElement;
    if (!p || seen.indexOf(p) !== -1) return;
    seen.push(p);
    if (p.classList && p.classList.contains('tl')) return;   /* timeline cards: spine-driven, no sibling delay */
    var kids = [].slice.call(p.children).filter(function(c){
      return c.classList && c.classList.contains('reveal') && !DELAYED.test(c.className);
    });
    if (kids.length < 2) return;
    kids.forEach(function(c, i){
      c.style.transitionDelay = Math.min(i * 0.07, 0.35).toFixed(2) + 's';
    });
  });

  // Above-the-fold release, then an ON-SCREEN-ONLY safety net. A blanket
  // reveal-everything net would kill every scroll entrance below the fold.
  requestAnimationFrame(function(){
    els.forEach(function(el){
      if (el.getBoundingClientRect().top < window.innerHeight * 0.92) el.classList.add('in');
    });
  });
  setTimeout(function(){
    els.forEach(function(el){
      var rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight && rect.bottom > 0) el.classList.add('in');
    });
  }, 2500);

  // Scroll sweep: IO samples at frame boundaries, so a fast flick can jump a
  // short block clean over its trigger line. Catch anything at the observer's
  // own trigger point (-12% viewport) and nothing below it.
  var sweepRaf = 0;
  function sweep(){
    sweepRaf = 0;
    var left = document.querySelectorAll('.ins-page .reveal:not(.in)');
    for (var i = 0; i < left.length; i++){
      if (left[i].getBoundingClientRect().top < window.innerHeight * 0.92) left[i].classList.add('in');
    }
    if (!document.querySelectorAll('.ins-page .reveal:not(.in)').length){
      window.removeEventListener('scroll', onSweep);
    }
  }
  function onSweep(){ if (!sweepRaf) sweepRaf = requestAnimationFrame(sweep); }
  window.addEventListener('scroll', onSweep, { passive:true });
})();
</script>

<script>
(function(){
  'use strict';
  /* Hub-card icons draw themselves on when the card first reaches the
     viewport. Path lengths are MEASURED (getTotalLength) rather than hardcoded,
     so swapping an SVG can't silently break the effect. */
  var cards = [].slice.call(document.querySelectorAll('.ins-page .hub__btn'));
  if (!cards.length) return;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  cards.forEach(function(card){
    var shapes = card.querySelectorAll('.hub__ic svg path, .hub__ic svg circle, .hub__ic svg rect, .hub__ic svg line, .hub__ic svg polyline');
    [].forEach.call(shapes, function(s){
      var len = 0;
      try { len = s.getTotalLength ? s.getTotalLength() : 0; } catch(e){ len = 0; }
      if (!len) return;                       /* unmeasurable shape: leave it alone */
      len = Math.ceil(len) + 1;
      s.setAttribute('stroke-dasharray', len);
      s.style.setProperty('--dash', len);
      if (reduced) s.style.strokeDashoffset = '0';
    });
  });
  if (reduced){ cards.forEach(function(c){ c.classList.add('draw'); }); return; }

  function draw(card){ card.classList.add('draw'); }
  if (!('IntersectionObserver' in window)){ cards.forEach(draw); return; }
  var io = new IntersectionObserver(function(en){
    en.forEach(function(x){ if (x.isIntersecting){ draw(x.target); io.unobserve(x.target); } });
  }, { threshold:0, rootMargin:'0px 0px -8% 0px' });
  cards.forEach(function(c){ io.observe(c); });
})();
</script>

<script>
(function(){
  'use strict';
  /* Cursor follow for the hub cards: the card tilts toward the pointer and a
     spotlight tracks it. Spring-damped so the motion feels weighted; on leave
     it eases back to rest and returns control to the page's own transitions.
     Fine pointers only. */
  var mq = window.matchMedia;
  if (mq && (mq('(prefers-reduced-motion: reduce)').matches || mq('(hover: none)').matches || mq('(pointer: coarse)').matches)) return;
  var SEL = '.ins-page .hub__btn';
  var STIFF = 70, DAMP = 13, MAX_RX = 6, MAX_RY = 8;

  /* State is keyed off the element itself and created on first contact, and the
     pointer is tracked by DELEGATION on the document rather than by listeners
     bound to a fixed list at load. GHL can replace or re-render a node after
     this script runs; with per-element binding that card's listeners would be
     attached to a detached node and it would silently stop responding while
     every other card kept working. Delegation resolves the card from whatever
     is under the pointer right now, so a swapped node still behaves. */
  var states = (typeof WeakMap === 'function') ? new WeakMap() : null;
  var stateList = [];   /* fallback for environments without WeakMap */

  function stateFor(el){
    var st = states ? states.get(el) : null;
    if (!st && !states){
      for (var i = 0; i < stateList.length; i++){ if (stateList[i].el === el){ st = stateList[i]; break; } }
    }
    if (st) return st;
    st = mkState(el);
    if (states) states.set(el, st); else stateList.push(st);
    return st;
  }

  function mkState(el){
    var st = { el:el, tx:0, ty:0, x:0, y:0, vx:0, vy:0, hover:false, raf:0, last:0 };

    function frame(now){
      st.raf = 0;
      var dt = Math.min(0.05, (now - (st.last || now)) / 1000); st.last = now;
      var ax = STIFF * (st.tx - st.x) - DAMP * st.vx;
      var ay = STIFF * (st.ty - st.y) - DAMP * st.vy;
      st.vx += ax * dt; st.vy += ay * dt;
      st.x += st.vx * dt; st.y += st.vy * dt;
      var rx = -st.y * MAX_RX, ry = st.x * MAX_RY;          /* tilt toward the pointer */
      var base = 1;
      var sc = st.hover ? base * 1.012 : base;
      var lift = st.hover ? ' translateY(-4px)' : '';
      el.style.transform = 'perspective(1000px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)' + lift + ' scale(' + sc.toFixed(3) + ')';
      var moving = Math.abs(st.tx - st.x) > 0.002 || Math.abs(st.ty - st.y) > 0.002 ||
                   Math.abs(st.vx) > 0.002 || Math.abs(st.vy) > 0.002;
      if (st.hover || moving){ st.raf = requestAnimationFrame(frame); }
      else {
        /* fully at rest: hand the element back to its stylesheet transforms */
        el.style.transform = '';
        el.classList.remove('is-follow');
        st.last = 0;
      }
    }
    st.schedule = function(){ if (!st.raf) st.raf = requestAnimationFrame(frame); };
    return st;
  }

  function enter(el){
    var st = stateFor(el);
    st.hover = true; el.classList.add('is-follow'); el.classList.add('is-glow'); st.schedule();
  }
  function leave(el){
    var st = stateFor(el);
    st.hover = false; st.tx = 0; st.ty = 0;
    el.classList.remove('is-glow');            /* glow fades from the moment you leave */
    st.schedule();                             /* the tilt springs back on its own */
  }
  function track(el, e){
    var st = stateFor(el);
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    st.tx = (px - 0.5) * 2; st.ty = (py - 0.5) * 2;       /* -1..1 */
    el.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
    el.style.setProperty('--my', (py * 100).toFixed(1) + '%');
    st.schedule();
  }

  var current = null;
  function onMove(e){
    var t = e.target;
    var el = (t && t.closest) ? t.closest(SEL) : null;
    /* SVG children in some engines lack closest(); walk up manually */
    if (!el && t){
      var n = t.parentNode;
      while (n && n.nodeType === 1 && !el){
        if (n.matches && n.matches(SEL)) el = n;
        n = n.parentNode;
      }
    }
    if (el !== current){
      if (current) leave(current);
      current = el;
      if (el) enter(el);
    }
    if (el) track(el, e);
  }

  document.addEventListener('mousemove', onMove, { passive:true });
  /* pointer left the window entirely */
  document.addEventListener('mouseleave', function(){ if (current){ leave(current); current = null; } });
  /* a scroll can move a card out from under a stationary pointer */
  window.addEventListener('scroll', function(){
    if (current){
      var r = current.getBoundingClientRect();
      if (r.bottom < 0 || r.top > window.innerHeight){ leave(current); current = null; }
    }
  }, { passive:true });
})();
</script>
